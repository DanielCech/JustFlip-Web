chapters:
  - number: "1"
    title: "Vítej v JustFlip!"
    blurb: "Zájmy, balíčky a kartičky — jak je tvoje knihovna uspořádaná, a rychlá prohlídka."
    slug: "welcome"
  - number: "2"
    title: "Tvoje první opakování"
    blurb: "Otoč, ohodnoť, opakuj. Co doopravdy dělají Znovu, Těžké, Dobré a Snadné a co ti ukazuje panel Dnes."
    slug: "first-review"
  - number: "3"
    title: "Jak psát skvělé kartičky"
    blurb: "Formátování, doplňovačky, matematika, kód, diagramy, tabulky, obrázky a mluvené nápovědy."
    slug: "writing-cards"
  - number: "4"
    title: "Obrázky, zvuk a zakrývání"
    blurb: "Obrázky, které fungují ve světlém i tmavém režimu, zvuk na kartičce a zakrývání obrázků."
    slug: "media"
  - number: "5"
    title: "Jak dostat balíčky dovnitř"
    blurb: "Balíčky z Anki, tabulky CSV, balíčky od AI — a co se stane při opakovaném importu."
    slug: "importing"
  - number: "6"
    title: "Jak funguje plánování"
    blurb: "Rozložené opakování lidsky: intervaly, snadnost, priority a odkládání."
    slug: "scheduling"
  - number: "7"
    title: "Učení poslechem"
    blurb: "Tlačítko Přehrát, Mluvit karty pro celé balíčky a výběr nejlepších hlasů."
    slug: "listening"
  - number: "8"
    title: "JustFlip! všude"
    blurb: "iPad, Mac a jeho klávesnice, Apple Watch, widgety, Siri a Spotlight."
    slug: "everywhere"
  - number: "9"
    title: "Statistiky a Zeptat se AI"
    blurb: "Poctivé čtení tvé retence a zadání pro vlastního AI lektora."
    slug: "statistics-ask-ai"
  - number: "10"
    title: "Synchronizace, zálohy a tvoje data"
    blurb: "Synchronizace přes iCloud, automatické zálohy, Nedávno smazané a exporty."
    slug: "sync-backup"
  - number: "11"
    title: "Přístupnost a motivy"
    blurb: "VoiceOver, větší text, Ovládání hlasem a pět motivů."
    slug: "accessibility-themes"
  - number: "12"
    title: "Referenční přehled"
    blurb: "Řešení problémů, slovníček, Zdarma a Pro, formáty souborů a zkratky."
    slug: "reference"
