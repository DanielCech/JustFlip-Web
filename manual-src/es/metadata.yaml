chapters:
  - number: "1"
    title: "Bienvenido a JustFlip!"
    blurb: "Intereses, mazos y tarjetas: cómo se organiza tu biblioteca, y un recorrido rápido."
    slug: "welcome"
  - number: "2"
    title: "Tu primer repaso"
    blurb: "Voltear, evaluar, repetir. Qué hacen de verdad De nuevo, Difícil, Bien y Fácil, y qué te muestra Hoy."
    slug: "first-review"
  - number: "3"
    title: "Cómo escribir buenas tarjetas"
    blurb: "Formato, huecos, matemáticas, código, diagramas, tablas, imágenes y pistas habladas."
    slug: "writing-cards"
  - number: "4"
    title: "Imágenes, sonido y oclusión"
    blurb: "Imágenes que funcionan en modo claro y oscuro, sonido en una tarjeta y oclusión de imagen."
    slug: "media"
  - number: "5"
    title: "Cómo traer mazos"
    blurb: "Paquetes de Anki, hojas de cálculo CSV, mazos hechos con IA, y qué pasa al volver a importar."
    slug: "importing"
  - number: "6"
    title: "Cómo funciona la programación"
    blurb: "La repetición espaciada en palabras sencillas: intervalos, facilidad, prioridades y posponer."
    slug: "scheduling"
  - number: "7"
    title: "Aprender de oído"
    blurb: "El botón Reproducir, Leer tarjetas para mazos enteros y cómo elegir las mejores voces."
    slug: "listening"
  - number: "8"
    title: "JustFlip! en todas partes"
    blurb: "iPad, el Mac y su teclado, Apple Watch, widgets, Siri y Spotlight."
    slug: "everywhere"
  - number: "9"
    title: "Estadísticas y Preguntar a la IA"
    blurb: "Cómo leer tu retención con honestidad, y cómo darle instrucciones a tu propio tutor de IA."
    slug: "statistics-ask-ai"
  - number: "10"
    title: "Sincronización, copias de seguridad y tus datos"
    blurb: "Sincronización con iCloud, copias de seguridad automáticas, Eliminados recientemente y exportaciones."
    slug: "sync-backup"
  - number: "11"
    title: "Accesibilidad y temas"
    blurb: "VoiceOver, texto más grande, Control por voz y los cinco temas."
    slug: "accessibility-themes"
  - number: "12"
    title: "Referencia"
    blurb: "Solución de problemas, glosario, gratis y Pro, formatos de archivo y atajos."
    slug: "reference"
