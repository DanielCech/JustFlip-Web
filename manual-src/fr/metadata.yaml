chapters:
  - number: "1"
    title: "Bienvenue dans JustFlip!"
    blurb: "Centres d’intérêt, paquets et cartes — comment ta bibliothèque est organisée, et un petit tour de l’app."
    slug: "welcome"
  - number: "2"
    title: "Ta première révision"
    blurb: "Retourner, noter, recommencer. Ce que font vraiment À revoir, Difficile, Bien et Facile, et ce que montre Aujourd’hui."
    slug: "first-review"
  - number: "3"
    title: "Écrire de bonnes cartes"
    blurb: "Mise en forme, textes à trous, maths, code, diagrammes, tableaux, images et indices parlés."
    slug: "writing-cards"
  - number: "4"
    title: "Images, son et occlusion"
    blurb: "Des images qui fonctionnent en clair comme en sombre, du son sur une carte, et l’occlusion d’image."
    slug: "media"
  - number: "5"
    title: "Importer des paquets"
    blurb: "Paquets Anki, feuilles de calcul CSV, paquets créés par IA — et ce qui se passe lors d’une réimportation."
    slug: "importing"
  - number: "6"
    title: "Comment fonctionne la planification"
    blurb: "La répétition espacée en termes simples : intervalles, facilité, priorités et report."
    slug: "scheduling"
  - number: "7"
    title: "Apprendre à l’oreille"
    blurb: "Le bouton Lire, Lire les cartes pour des paquets entiers, et le choix des meilleures voix."
    slug: "listening"
  - number: "8"
    title: "JustFlip! partout"
    blurb: "iPad, Mac et son clavier, Apple Watch, widgets, Siri et Spotlight."
    slug: "everywhere"
  - number: "9"
    title: "Statistiques et Demander à l’IA"
    blurb: "Lire honnêtement ta rétention, et briefer ton propre tuteur IA."
    slug: "statistics-ask-ai"
  - number: "10"
    title: "Synchronisation, sauvegardes et données"
    blurb: "Synchronisation iCloud, sauvegardes automatiques, Récemment supprimés et exports."
    slug: "sync-backup"
  - number: "11"
    title: "Accessibilité et thèmes"
    blurb: "VoiceOver, texte plus grand, Contrôle vocal et les cinq thèmes."
    slug: "accessibility-themes"
  - number: "12"
    title: "Référence"
    blurb: "Dépannage, glossaire, version gratuite et Pro, formats de fichiers et raccourcis."
    slug: "reference"
