chapters:
  - number: "1"
    title: "Willkommen bei JustFlip!"
    blurb: "Interessen, Stapel und Karten — wie deine Bibliothek aufgebaut ist, dazu ein kurzer Rundgang."
    slug: "welcome"
  - number: "2"
    title: "Deine erste Wiederholung"
    blurb: "Umdrehen, bewerten, weiter. Was Nochmal, Schwer, Gut und Leicht wirklich bewirken und was dir Heute zeigt."
    slug: "first-review"
  - number: "3"
    title: "Gute Karten schreiben"
    blurb: "Formatierung, Lückentext, Mathematik, Code, Diagramme, Tabellen, Bilder und gesprochene Hinweise."
    slug: "writing-cards"
  - number: "4"
    title: "Bilder, Ton und Bildabdeckung"
    blurb: "Bilder, die hell wie dunkel funktionieren, Ton auf der Karte und Bildabdeckung."
    slug: "media"
  - number: "5"
    title: "Stapel importieren"
    blurb: "Anki-Pakete, CSV-Tabellen, KI-erstellte Stapel — und was beim erneuten Import passiert."
    slug: "importing"
  - number: "6"
    title: "So funktioniert die Planung"
    blurb: "Verteilte Wiederholung einfach erklärt: Intervalle, Leichtigkeit, Prioritäten und Zurückstellen."
    slug: "scheduling"
  - number: "7"
    title: "Lernen mit den Ohren"
    blurb: "Die Abspieltaste, Karten vorlesen für ganze Stapel und die besten Stimmen."
    slug: "listening"
  - number: "8"
    title: "JustFlip! überall"
    blurb: "iPad, Mac und seine Tastatur, Apple Watch, Widgets, Siri und Spotlight."
    slug: "everywhere"
  - number: "9"
    title: "Statistiken und KI fragen"
    blurb: "Die eigene Behaltensrate ehrlich lesen und deinen eigenen KI-Tutor briefen."
    slug: "statistics-ask-ai"
  - number: "10"
    title: "Sync, Sicherungen und deine Daten"
    blurb: "iCloud-Synchronisierung, automatische Sicherungen, Zuletzt gelöscht und Exporte."
    slug: "sync-backup"
  - number: "11"
    title: "Bedienungshilfen und Designs"
    blurb: "VoiceOver, größerer Text, Sprachsteuerung und die fünf Designs."
    slug: "accessibility-themes"
  - number: "12"
    title: "Nachschlagen"
    blurb: "Fehlerbehebung, Glossar, Free und Pro, Dateiformate und Tastenkürzel."
    slug: "reference"
