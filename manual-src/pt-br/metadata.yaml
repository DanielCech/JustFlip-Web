chapters:
  - number: "1"
    title: "Boas-vindas ao JustFlip!"
    blurb: "Interesses, baralhos e cartões — como a sua biblioteca é organizada, e um passeio rápido."
    slug: "welcome"
  - number: "2"
    title: "Sua primeira revisão"
    blurb: "Virar, avaliar, repetir. O que De novo, Difícil, Bom e Fácil fazem de verdade, e o que o painel Hoje mostra."
    slug: "first-review"
  - number: "3"
    title: "Escrevendo ótimos cartões"
    blurb: "Formatação, cloze, matemática, código, diagramas, tabelas, imagens e dicas faladas."
    slug: "writing-cards"
  - number: "4"
    title: "Imagens, som e oclusão"
    blurb: "Imagens que funcionam no claro e no escuro, som num cartão e oclusão de imagem."
    slug: "media"
  - number: "5"
    title: "Trazendo baralhos"
    blurb: "Pacotes do Anki, planilhas CSV, baralhos feitos por IA — e o que acontece ao reimportar."
    slug: "importing"
  - number: "6"
    title: "Como funciona a programação"
    blurb: "Repetição espaçada em palavras simples: intervalos, facilidade, prioridades e adiamentos."
    slug: "scheduling"
  - number: "7"
    title: "Aprender ouvindo"
    blurb: "O botão Reproduzir, Ler cartões para baralhos inteiros e a escolha das melhores vozes."
    slug: "listening"
  - number: "8"
    title: "JustFlip! em todo lugar"
    blurb: "iPad, Mac e seu teclado, Apple Watch, widgets, Siri e Spotlight."
    slug: "everywhere"
  - number: "9"
    title: "Estatísticas e Perguntar à IA"
    blurb: "Ler a sua retenção com honestidade e preparar o seu próprio tutor de IA."
    slug: "statistics-ask-ai"
  - number: "10"
    title: "Sincronização, backups e seus dados"
    blurb: "Sincronização com o iCloud, backups automáticos, Apagados Recentemente e exportações."
    slug: "sync-backup"
  - number: "11"
    title: "Acessibilidade e temas"
    blurb: "VoiceOver, texto maior, Controle por Voz e os cinco temas."
    slug: "accessibility-themes"
  - number: "12"
    title: "Referência"
    blurb: "Solução de problemas, glossário, Grátis e Pro, formatos de arquivo e atalhos."
    slug: "reference"
