chapters:
  - number: "1"
    title: "JustFlip!에 오신 것을 환영해요"
    blurb: "관심사, 덱, 카드 — 라이브러리가 어떻게 구성되는지, 그리고 간단한 둘러보기."
    slug: "welcome"
  - number: "2"
    title: "첫 복습"
    blurb: "뒤집고, 평가하고, 반복하기. 다시, 어려움, 보통, 쉬움이 실제로 하는 일과 오늘 화면이 보여 주는 것."
    slug: "first-review"
  - number: "3"
    title: "좋은 카드 만들기"
    blurb: "서식, 빈칸 채우기, 수식, 코드, 다이어그램, 표, 그림, 음성 힌트."
    slug: "writing-cards"
  - number: "4"
    title: "그림, 소리, 이미지 가리기"
    blurb: "라이트와 다크 모드 모두에서 잘 보이는 그림, 카드 속 소리, 이미지 가리기."
    slug: "media"
  - number: "5"
    title: "덱 가져오기"
    blurb: "Anki 패키지, CSV 스프레드시트, AI로 만든 덱 — 그리고 다시 가져올 때 일어나는 일."
    slug: "importing"
  - number: "6"
    title: "일정은 어떻게 정해질까"
    blurb: "쉬운 말로 풀어 쓴 간격 반복: 간격, 용이도, 우선순위, 미루기."
    slug: "scheduling"
  - number: "7"
    title: "귀로 배우기"
    blurb: "재생 버튼, 덱 전체를 읽어 주는 카드 읽어주기, 그리고 가장 좋은 음성 고르기."
    slug: "listening"
  - number: "8"
    title: "어디서나 JustFlip!"
    blurb: "iPad, Mac과 키보드, Apple Watch, 위젯, Siri, Spotlight."
    slug: "everywhere"
  - number: "9"
    title: "통계와 AI에게 질문"
    blurb: "기억 유지율을 솔직하게 읽는 법, 그리고 나만의 AI 튜터에게 상황을 알려 주는 법."
    slug: "statistics-ask-ai"
  - number: "10"
    title: "동기화, 백업, 그리고 내 데이터"
    blurb: "iCloud 동기화, 자동 백업, 최근 삭제된 항목, 내보내기."
    slug: "sync-backup"
  - number: "11"
    title: "손쉬운 사용과 테마"
    blurb: "VoiceOver, 더 큰 텍스트, 음성 제어, 그리고 다섯 가지 테마."
    slug: "accessibility-themes"
  - number: "12"
    title: "참고 자료"
    blurb: "문제 해결, 용어집, 무료와 Pro, 파일 형식과 단축키."
    slug: "reference"
