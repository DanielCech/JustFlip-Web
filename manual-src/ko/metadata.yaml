# Everything a translator touches besides the chapter files lives here.
lang: ko
manual-title: "사용 설명서"
manual-subtitle: "Anki의 힘, Apple다운 완성도 — JustFlip!으로 할 수 있는 모든 것, 그리고 그걸 가능하게 하는 작은 규칙들."
edition: "파일럿 에디션 · 2026년 9월"
pdf-file: "JustFlip-Manual-ko.pdf"
