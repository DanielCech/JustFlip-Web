chapters:
  - number: "1"
    title: "Benvenuto in JustFlip!"
    blurb: "Interessi, mazzi e carte — come è organizzata la tua libreria, e un giro veloce."
    slug: "welcome"
  - number: "2"
    title: "Il tuo primo ripasso"
    blurb: "Gira, valuta, ripeti. Cosa fanno davvero Di nuovo, Difficile, Bene e Facile, e cosa ti mostra Oggi."
    slug: "first-review"
  - number: "3"
    title: "Scrivere carte efficaci"
    blurb: "Formattazione, completamento, matematica, codice, diagrammi, tabelle, immagini e suggerimenti vocali."
    slug: "writing-cards"
  - number: "4"
    title: "Immagini, suoni e occlusione"
    blurb: "Immagini che funzionano in modalità chiara e scura, audio sulle carte e occlusione delle immagini."
    slug: "media"
  - number: "5"
    title: "Importare i mazzi"
    blurb: "Pacchetti Anki, fogli di calcolo CSV, mazzi creati dall'IA — e cosa succede quando reimporti."
    slug: "importing"
  - number: "6"
    title: "Come funziona la pianificazione"
    blurb: "La ripetizione dilazionata in parole semplici: intervalli, facilità, priorità e rinvii."
    slug: "scheduling"
  - number: "7"
    title: "Imparare ascoltando"
    blurb: "Il pulsante Riproduci, Leggi carte per mazzi interi e come scegliere le voci migliori."
    slug: "listening"
  - number: "8"
    title: "JustFlip! ovunque"
    blurb: "iPad, il Mac e la sua tastiera, Apple Watch, widget, Siri e Spotlight."
    slug: "everywhere"
  - number: "9"
    title: "Statistiche e Chiedi all'IA"
    blurb: "Leggere onestamente la tua ritenzione, e istruire il tuo tutor IA personale."
    slug: "statistics-ask-ai"
  - number: "10"
    title: "Sincronizzazione, backup e i tuoi dati"
    blurb: "Sincronizzazione iCloud, backup automatici, Eliminati di recente ed esportazioni."
    slug: "sync-backup"
  - number: "11"
    title: "Accessibilità e temi"
    blurb: "VoiceOver, testo più grande, Controllo vocale e i cinque temi."
    slug: "accessibility-themes"
  - number: "12"
    title: "Riferimento"
    blurb: "Risoluzione dei problemi, glossario, Gratis e Pro, formati di file e scorciatoie."
    slug: "reference"
