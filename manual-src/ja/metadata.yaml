chapters:
  - number: "1"
    title: "JustFlip! へようこそ"
    blurb: "コレクション、デッキ、カード——ライブラリの構成と、画面をひと巡りするツアー。"
    slug: "welcome"
  - number: "2"
    title: "はじめての復習"
    blurb: "めくって、評価して、繰り返す。「もう一度」「難しい」「普通」「簡単」が実際に何をするのか、そして「今日」に何が表示されるのか。"
    slug: "first-review"
  - number: "3"
    title: "よいカードの書き方"
    blurb: "書式、穴埋め、数式、コード、ダイアグラム、表、画像、読み上げのヒント。"
    slug: "writing-cards"
  - number: "4"
    title: "画像、音声、オクルージョン"
    blurb: "ライトでもダークでも映える画像、カードの音声、そして画像オクルージョン。"
    slug: "media"
  - number: "5"
    title: "デッキを取り込む"
    blurb: "Anki パッケージ、CSV スプレッドシート、AI が作ったデッキ——そして再読み込み時に起きること。"
    slug: "importing"
  - number: "6"
    title: "スケジュールの仕組み"
    blurb: "間隔反復をやさしい言葉で：間隔、易しさ、優先度、後回し。"
    slug: "scheduling"
  - number: "7"
    title: "耳で覚える"
    blurb: "再生ボタン、デッキ全体を読み上げる「カードを読み上げ」、そして最適な声の選び方。"
    slug: "listening"
  - number: "8"
    title: "どこでも JustFlip!"
    blurb: "iPad、Mac とキーボード、Apple Watch、ウィジェット、Siri、Spotlight。"
    slug: "everywhere"
  - number: "9"
    title: "統計と「AIに聞く」"
    blurb: "定着率を正直に読み解き、自分専用の AI チューターに的確な指示を出す。"
    slug: "statistics-ask-ai"
  - number: "10"
    title: "同期、バックアップ、データ"
    blurb: "iCloud 同期、自動バックアップ、「最近削除した項目」、書き出し。"
    slug: "sync-backup"
  - number: "11"
    title: "アクセシビリティとテーマ"
    blurb: "VoiceOver、さらに大きな文字、音声コントロール、5 つのテーマ。"
    slug: "accessibility-themes"
  - number: "12"
    title: "リファレンス"
    blurb: "トラブルシューティング、用語集、無料版と Pro、ファイル形式、ショートカット。"
    slug: "reference"
